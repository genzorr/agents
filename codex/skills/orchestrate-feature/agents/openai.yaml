interface:
  display_name: "Orchestrate Feature"
  short_description: "Launch, review and validate a feature handoff"
  default_prompt: "Use $orchestrate-feature to launch or resume a separate owner for this agreed feature. I authorize as many bounded Luna helpers as useful and advisor consultation as needed, and require independent review before completed delivery. Assess the handoff here through validation; bring merge and adoption decisions to me."
policy:
  allow_implicit_invocation: false
